<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kato.8 dev admin</title>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f26; --panel2: #23262f; --line: #33363f;
    --text: #e8e9ec; --dim: #9aa0ab; --accent: #ff9183; --ok: #7dd97d; --err: #ff7d7d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: center; gap: 20px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; color: var(--accent); }
  header .hint { color: var(--dim); font-size: 12px; margin-left: auto; }
  nav.tabs { display: flex; gap: 4px; }
  nav.tabs button { background: none; border: 1px solid transparent; color: var(--dim);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  nav.tabs button.active { background: var(--panel2); color: var(--text); border-color: var(--line); }
  main { display: grid; grid-template-columns: 210px minmax(380px, 1fr) minmax(320px, 1.1fr);
    height: calc(100vh - 45px); }
  #list { border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; }
  #list button.item { display: block; width: 100%; text-align: left; background: none;
    border: none; color: var(--text); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  #list button.item.active { background: var(--panel2); }
  #list button.item small { display: block; color: var(--dim); }
  #list .add { margin-top: 8px; width: 100%; background: var(--panel2); color: var(--dim);
    border: 1px dashed var(--line); border-radius: 6px; padding: 6px; cursor: pointer; }
  #form { overflow-y: auto; padding: 16px 20px; }
  #form h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); margin: 18px 0 6px; }
  #form h2:first-child { margin-top: 0; }
  label { display: block; margin: 10px 0 2px; color: var(--dim); font-size: 12px; }
  input[type=text], textarea { width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .row input[type=color] { flex: 0 0 34px; height: 34px; padding: 2px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; }
  .checks { display: flex; gap: 18px; margin-top: 10px; color: var(--dim); }
  .checks label { display: flex; gap: 6px; align-items: center; margin: 0; cursor: pointer; }
  .bar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 4px;
    display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); margin-top: 18px; }
  .bar button { background: var(--accent); color: #14151a; font-weight: 600; border: none;
    border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  .bar button.ghost { background: var(--panel2); color: var(--err); font-weight: 400; }
  #status { font-size: 12px; color: var(--dim); }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  #preview { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  #preview .pbar { padding: 6px 10px; font-size: 12px; color: var(--dim);
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  #preview iframe { flex: 1; border: none; background: #fff; }
  table.endpoints { width: 100%; border-collapse: collapse; }
  table.endpoints th { text-align: left; color: var(--dim); font-size: 12px; font-weight: 400;
    padding: 4px 6px; }
  table.endpoints td { padding: 3px 6px 3px 0; }
  .placeholder { color: var(--dim); padding: 40px; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Kato.8 dev admin</h1>
  <nav class="tabs" id="tabs"></nav>
  <span class="hint">saves rewrite src/data/*.js — the live site hot-reloads</span>
</header>
<main>
  <div id="list"></div>
  <div id="form"></div>
  <div id="preview">
    <div class="pbar"><span id="purl"></span><a id="popen" target="_blank">open ↗</a></div>
    <iframe id="pframe"></iframe>
  </div>
</main>
<script>
const $ = (sel, el = document) => el.querySelector(sel)
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else if (k === 'checked' || k === 'value') n[k] = v
    else n.setAttribute(k, v)
  }
  n.append(...kids)
  return n
}

let data = null
let tab = 'games'
let selected = null
let dirty = false

const TABS = { games: 'Games', seo: 'SEO', endpoints: 'Endpoints', art: 'Concept art' }

function setDirty(v) { dirty = v; status(dirty ? 'unsaved changes' : '') }
window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault() })

function status(msg, cls = '') {
  const s = $('#status')
  if (s) { s.textContent = msg; s.className = cls }
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'content-type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  })
  const json = await res.json()
  if (!res.ok) throw new Error(json.error || res.statusText)
  return json
}

async function save(name, value, label) {
  try {
    await api('PUT', `/__admin/api/block/${name}`, value)
    setDirty(false)
    status(`${label} saved ✓`, 'ok')
  } catch (err) {
    status(`save failed: ${err.message}`, 'err')
    throw err
  }
}

function preview(path) {
  $('#purl').textContent = path
  $('#popen').href = path
  if ($('#pframe').getAttribute('src') !== path) $('#pframe').src = path
}

// ---- fields ---------------------------------------------------------------

function textField(obj, key, label, opts = {}) {
  const input = el('input', {
    type: 'text', value: obj[key] ?? '',
    oninput: () => {
      if (input.value === '') delete obj[key]
      else obj[key] = input.value
      setDirty(true)
    },
  })
  const wrap = el('div', {}, el('label', {}, label), input)
  if (opts.color) {
    const swatch = el('input', {
      type: 'color', value: /^#[0-9a-fA-F]{6}$/.test(obj[key] ?? '') ? obj[key] : '#000000',
      oninput: () => { obj[key] = swatch.value; input.value = swatch.value; setDirty(true) },
    })
    input.addEventListener('input', () => {
      if (/^#[0-9a-fA-F]{6}$/.test(input.value)) swatch.value = input.value
    })
    wrap.replaceChildren(el('label', {}, label), el('div', { class: 'row' }, swatch, input))
  }
  return wrap
}

function paragraphsField(obj, key, label) {
  const ta = el('textarea', {
    value: (obj[key] ?? []).join('\n\n'),
    oninput: () => {
      const paras = ta.value.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean)
      if (paras.length) obj[key] = paras
      else delete obj[key]
      setDirty(true)
    },
  })
  return el('div', {}, el('label', {}, `${label} — blank line separates paragraphs`), ta)
}

function listField(obj, key, label) {
  const input = el('input', {
    type: 'text', value: (obj[key] ?? []).join(', '),
    oninput: () => {
      const items = input.value.split(',').map((s) => s.trim()).filter(Boolean)
      obj[key] = items
      setDirty(true)
    },
  })
  return el('div', {}, el('label', {}, `${label} — comma separated`), input)
}

function checkField(obj, key, label) {
  const input = el('input', {
    type: 'checkbox', checked: !!obj[key],
    onchange: () => { obj[key] = input.checked; setDirty(true) },
  })
  return el('label', {}, input, label)
}

function saveBar(onSave, extra = []) {
  return el('div', { class: 'bar' },
    el('button', { onclick: onSave }, 'Save'),
    ...extra,
    el('span', { id: 'status' }))
}

// ---- games tab ------------------------------------------------------------

function renderGames() {
  const games = data.games
  if (!games.some((g) => g.slug === selected)) selected = games[0]?.slug ?? null
  const game = games.find((g) => g.slug === selected)

  $('#list').replaceChildren(
    ...games.map((g) => el('button', {
      class: `item${g.slug === selected ? ' active' : ''}`,
      onclick: () => { selected = g.slug; renderGames() },
    }, g.title, el('small', {}, g.slug))),
    el('button', {
      class: 'add',
      onclick: () => {
        const slug = prompt('Slug for the new game (kebab-case, used in /games/<slug>):')
        if (!slug) return
        if (!/^[a-z0-9-]+$/.test(slug)) return alert('kebab-case only: a-z, 0-9, dashes')
        if (games.some((g) => g.slug === slug)) return alert('slug already exists')
        games.push({ slug, title: slug, tagline: '', description: '', categories: [],
          bgColor: '#888888', comingSoon: true, framedArt: false, gameplay: [], story: [] })
        selected = slug
        setDirty(true)
        renderGames()
      },
    }, '+ add game'))

  if (!game) { $('#form').replaceChildren(el('div', { class: 'placeholder' }, 'no games')); return }

  const storyImage = game.storyImage ?? {}
  const syncStoryImage = () => {
    if (storyImage.src || storyImage.alt) game.storyImage = storyImage
    else delete game.storyImage
  }

  $('#form').replaceChildren(
    el('h2', {}, 'Card'),
    textField(game, 'title', 'Title'),
    textField(game, 'tagline', 'Tagline'),
    textField(game, 'description', 'Description (fallback)'),
    listField(game, 'categories', 'Categories'),
    el('div', { class: 'row' },
      textField(game, 'bgColor', 'Card background color', { color: true }),
      textField(game, 'bgImage', 'Card background image (/assets/…)')),
    el('h2', {}, 'Game page'),
    textField(game, 'kickstarterUrl', 'Kickstarter URL (empty = no CTA)'),
    el('div', { class: 'checks' },
      checkField(game, 'comingSoon', 'coming soon tag'),
      checkField(game, 'framedArt', 'framed art block')),
    paragraphsField(game, 'gameplay', 'Gameplay'),
    paragraphsField(game, 'story', 'Story'),
    el('div', { class: 'row' },
      el('div', {}, el('label', {}, 'Story image (/assets/…)'), el('input', {
        type: 'text', value: storyImage.src ?? '',
        oninput(e) { storyImage.src = e.target.value; syncStoryImage(); setDirty(true) },
      })),
      el('div', {}, el('label', {}, 'Story image alt text'), el('input', {
        type: 'text', value: storyImage.alt ?? '',
        oninput(e) { storyImage.alt = e.target.value; syncStoryImage(); setDirty(true) },
      }))),
    saveBar(async () => {
      await save('games', games, 'games.js')
      const missing = games.filter((g) => !data.gameRoutes[g.slug])
      if (missing.length && confirm(
        `No SEO entry for: ${missing.map((g) => g.slug).join(', ')}.\n` +
        'Create stub gameRoutes entries now? (Needed for prerender.)')) {
        for (const g of missing) {
          data.gameRoutes[g.slug] = {
            title: `${g.title} | Kato.8 Studios`,
            description: g.description || g.tagline || g.title,
            ogTitle: `${g.title} — ${g.tagline || 'from Kato.8 Studios'}`,
            ogDescription: g.description || g.tagline || g.title,
          }
        }
        await save('gameRoutes', data.gameRoutes, 'seo-config.js')
      }
      const noEndpoints = games.filter((g) => !data.discordEndpoints[g.slug] || !data.playtestEndpoints[g.slug])
      if (noEndpoints.length) {
        status(`saved ✓ — note: no Formspree endpoints for ${noEndpoints.map((g) => g.slug).join(', ')} (Endpoints tab)`, 'ok')
      }
    }, [el('button', {
      class: 'ghost',
      onclick: () => {
        if (!confirm(`Remove "${game.title}" from games.js?\n(SEO + endpoint entries are left alone.)`)) return
        games.splice(games.indexOf(game), 1)
        selected = null
        setDirty(true)
        renderGames()
      },
    }, 'delete game')]))

  preview(`/games/${game.slug}`)
}

// ---- seo tab ---------------------------------------------------------------

function renderSeo() {
  const routes = [
    ...Object.keys(data.staticRoutes).map((k) => ({ block: 'staticRoutes', key: k, path: k })),
    ...Object.keys(data.gameRoutes).map((k) => ({ block: 'gameRoutes', key: k, path: `/games/${k}` })),
  ]
  if (!routes.some((r) => r.path === selected)) selected = routes[0]?.path
  const route = routes.find((r) => r.path === selected)
  const entry = data[route.block][route.key]

  $('#list').replaceChildren(...routes.map((r) => el('button', {
    class: `item${r.path === selected ? ' active' : ''}`,
    onclick: () => { selected = r.path; renderSeo() },
  }, r.path, el('small', {}, r.block === 'staticRoutes' ? 'static' : 'game'))))

  $('#form').replaceChildren(
    el('h2', {}, `SEO — ${route.path}`),
    textField(entry, 'title', '<title>'),
    el('div', {}, el('label', {}, 'Meta description'), el('textarea', {
      value: entry.description ?? '',
      oninput(e) { entry.description = e.target.value; setDirty(true) },
    })),
    textField(entry, 'ogTitle', 'OG title'),
    el('div', {}, el('label', {}, 'OG description'), el('textarea', {
      value: entry.ogDescription ?? '',
      oninput(e) { entry.ogDescription = e.target.value; setDirty(true) },
    })),
    textField(entry, 'ogImage', 'OG image (/assets/…, empty = site default)'),
    saveBar(() => save(route.block, data[route.block], 'seo-config.js')))

  preview(route.path)
}

// ---- endpoints tab ---------------------------------------------------------

function renderEndpoints() {
  $('#list').replaceChildren(el('div', { class: 'placeholder' }, 'Formspree endpoints, keyed by game slug. Keep FORMSPREE.md in sync.'))
  const slugs = [...new Set([
    ...data.games.map((g) => g.slug),
    ...Object.keys(data.discordEndpoints),
    ...Object.keys(data.playtestEndpoints),
  ])]

  const cell = (map, slug) => el('td', {}, el('input', {
    type: 'text', value: map[slug] ?? '', placeholder: '(none — form no-ops)',
    oninput(e) {
      if (e.target.value) map[slug] = e.target.value
      else delete map[slug]
      setDirty(true)
    },
  }))

  $('#form').replaceChildren(
    el('h2', {}, 'Sign-up form endpoints'),
    el('table', { class: 'endpoints' },
      el('tr', {}, el('th', {}, 'game'), el('th', {}, 'Discord form'), el('th', {}, 'Playtest form')),
      ...slugs.map((slug) => el('tr', {},
        el('td', {}, slug),
        cell(data.discordEndpoints, slug),
        cell(data.playtestEndpoints, slug)))),
    saveBar(async () => {
      await save('discordEndpoints', data.discordEndpoints, 'discordEndpoints.js')
      await save('playtestEndpoints', data.playtestEndpoints, 'playtestEndpoints.js')
      status('both endpoint files saved ✓ — remember FORMSPREE.md', 'ok')
    }))

  preview('/')
}

// ---- shell -----------------------------------------------------------------

function renderArt() {
  $('#list').replaceChildren()
  $('#form').replaceChildren(el('div', { class: 'placeholder' },
    'Concept-art manager coming soon. Sources live under src/assets/games/<slug>/concept/<category>/ — drop files in; variants regenerate automatically.'))
  preview('/')
}

function render() {
  $('#tabs').replaceChildren(...Object.entries(TABS).map(([id, label]) => el('button', {
    class: id === tab ? 'active' : '',
    onclick: () => {
      if (dirty && !confirm('Discard unsaved changes?')) return
      setDirty(false)
      load().then(() => { tab = id; selected = null; render() })
    },
  }, label)))
  ;({ games: renderGames, seo: renderSeo, endpoints: renderEndpoints, art: renderArt })[tab]()
}

async function load() {
  data = await api('GET', '/__admin/api/data')
}

load().then(render).catch((err) => {
  document.body.replaceChildren(el('div', { class: 'placeholder' }, `failed to load: ${err.message}`))
})
</script>
</body>
</html>
