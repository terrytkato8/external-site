<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kato.8 dev admin</title>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f26; --panel2: #23262f; --line: #33363f;
    --text: #e8e9ec; --dim: #9aa0ab; --accent: #ff9183; --ok: #7dd97d; --err: #ff7d7d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: center; gap: 20px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; color: var(--accent); }
  header .hint { color: var(--dim); font-size: 12px; margin-left: auto; }
  nav.tabs { display: flex; gap: 4px; }
  nav.tabs button { background: none; border: 1px solid transparent; color: var(--dim);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  nav.tabs button.active { background: var(--panel2); color: var(--text); border-color: var(--line); }
  main { display: grid; grid-template-columns: 210px minmax(380px, 1fr) minmax(320px, 1.1fr);
    height: calc(100vh - 45px); }
  #list { border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; }
  #list button.item { display: block; width: 100%; text-align: left; background: none;
    border: none; color: var(--text); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  #list button.item.active { background: var(--panel2); }
  #list button.item small { display: block; color: var(--dim); }
  #list .add { margin-top: 8px; width: 100%; background: var(--panel2); color: var(--dim);
    border: 1px dashed var(--line); border-radius: 6px; padding: 6px; cursor: pointer; }
  #form { overflow-y: auto; padding: 16px 20px; }
  #form h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); margin: 18px 0 6px; }
  #form h2:first-child { margin-top: 0; }
  label { display: block; margin: 10px 0 2px; color: var(--dim); font-size: 12px; }
  input[type=text], textarea { width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .row input[type=color] { flex: 0 0 34px; height: 34px; padding: 2px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; }
  .checks { display: flex; gap: 18px; margin-top: 10px; color: var(--dim); }
  .checks label { display: flex; gap: 6px; align-items: center; margin: 0; cursor: pointer; }
  .bar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 4px;
    display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); margin-top: 18px; }
  .bar button { background: var(--accent); color: #14151a; font-weight: 600; border: none;
    border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  .bar button.ghost { background: var(--panel2); color: var(--err); font-weight: 400; }
  #status { font-size: 12px; color: var(--dim); }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  #preview { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  #preview .pbar { padding: 6px 10px; font-size: 12px; color: var(--dim);
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  #preview iframe { flex: 1; border: none; background: #fff; }
  table.endpoints { width: 100%; border-collapse: collapse; }
  table.endpoints th { text-align: left; color: var(--dim); font-size: 12px; font-weight: 400;
    padding: 4px 6px; }
  table.endpoints td { padding: 3px 6px 3px 0; }
  .placeholder { color: var(--dim); padding: 40px; text-align: center; }
  a { color: var(--accent); }
  .art-grid { display: flex; flex-direction: column; gap: 10px; }
  .art-card { display: flex; gap: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; align-items: center; }
  .art-card img { width: 96px; height: 64px; object-fit: cover; border-radius: 4px;
    background: var(--panel2); flex: none; }
  .art-card .meta { flex: 1; min-width: 0; }
  .art-card .meta .name { font-size: 13px; word-break: break-all; cursor: text; }
  .art-card .meta .name:hover { color: var(--accent); }
  .art-card .meta input { font-size: 13px; padding: 3px 6px; }
  .art-card .meta small { color: var(--dim); display: block; margin-top: 2px; }
  .art-card .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .art-card .chips span { font-size: 10px; padding: 1px 6px; border-radius: 8px;
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line); }
  .art-card .chips span.warn { color: var(--err); border-color: var(--err); }
  .art-card .ctl { display: flex; flex-direction: column; gap: 2px; flex: none; }
  .art-card .ctl button { background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; cursor: pointer; padding: 1px 8px; font-size: 12px; }
  .art-card .ctl button:disabled { opacity: .3; cursor: default; }
  .art-card button.ghost { background: none; border: none; color: var(--err); cursor: pointer;
    font-size: 11px; flex: none; }
  /* Games list reorder rows: ↑↓ stack beside the full-width item button. */
  .reorder-row { display: flex; align-items: stretch; gap: 4px; border-radius: 6px; }
  .reorder-row.active { background: var(--panel2); }
  .reorder-row .item { flex: 1; }
  .reorder-row .ctl { display: flex; flex-direction: column; justify-content: center; gap: 2px; flex: none; }
  .reorder-row .ctl button { background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; cursor: pointer; padding: 0 6px; font-size: 11px; line-height: 1.4; }
  .reorder-row .ctl button:disabled { opacity: .3; cursor: default; }
  /* Changes tab: status badges + colourised diff. */
  .gstatus { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); }
  .gstatus.g-M { color: var(--accent); } .gstatus.g-A, .gstatus.g-\?\? { color: var(--ok); }
  .gstatus.g-D { color: var(--err); }
  pre.diff { margin: 0; padding: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; overflow-x: auto; font: 12px/1.5 ui-monospace, monospace; white-space: pre; }
  pre.diff .dl.add { color: var(--ok); } pre.diff .dl.del { color: var(--err); }
  pre.diff .dl.hunk { color: var(--accent); } pre.diff .dl.meta { color: var(--dim); }
  /* Asset picker field: thumbnail + path input + Choose/Upload/Clear. */
  .asset-row { display: flex; gap: 10px; align-items: flex-start; margin-top: 2px; }
  .asset-thumb { width: 60px; height: 60px; flex: none; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel2) center/contain no-repeat; background-image: var(--thumb, none); }
  .asset-thumb.empty { display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 20px; }
  .asset-body { flex: 1; min-width: 0; }
  .asset-btns { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .asset-btns button { background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 5px; cursor: pointer; padding: 3px 10px; font-size: 12px; }
  .asset-btns button:hover { color: var(--text); border-color: var(--accent); }
  /* Picker modal overlay. */
  .picker-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
    align-items: center; justify-content: center; z-index: 50; }
  .picker-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    width: min(860px, 92vw); max-height: 86vh; display: flex; flex-direction: column; overflow: hidden; }
  .picker-head { display: flex; gap: 10px; align-items: center; padding: 12px 14px;
    border-bottom: 1px solid var(--line); }
  .picker-head h3 { margin: 0; font-size: 14px; color: var(--accent); flex: none; }
  .picker-head input { flex: 1; }
  .picker-head button { flex: none; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .picker-grid { padding: 12px; overflow-y: auto; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .picker-cell { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer;
    background: var(--panel2); text-align: left; padding: 0; color: var(--text); }
  .picker-cell:hover { border-color: var(--accent); }
  .picker-cell .ph { height: 90px; background: #0d0e12 center/contain no-repeat; }
  .picker-cell .cap { font-size: 10px; color: var(--dim); padding: 4px 6px; word-break: break-all;
    border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>Kato.8 dev admin</h1>
  <nav class="tabs" id="tabs"></nav>
  <span class="hint">saves rewrite src/data/*.js — the live site hot-reloads</span>
</header>
<main>
  <div id="list"></div>
  <div id="form"></div>
  <div id="preview">
    <div class="pbar"><span id="purl"></span><a id="popen" target="_blank">open ↗</a></div>
    <iframe id="pframe"></iframe>
  </div>
</main>
<script>
const $ = (sel, el = document) => el.querySelector(sel)
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined) continue
    if (k === 'class') n.className = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else if (k === 'checked' || k === 'value') n[k] = v
    else n.setAttribute(k, v)
  }
  n.append(...kids)
  return n
}

let data = null
let tab = 'games'
let selected = null
let dirty = false

// Crowdfunding appears only when the repo has src/data/crowdfundingGames.js
// (staging today; prod whenever the feature merges).
const TABS = () => ({
  games: 'Games',
  ...(data.crowdfundingGames ? { crowdfunding: 'Crowdfunding' } : {}),
  pages: 'Pages',
  ...(data.conventionBanner ? { banner: 'Banner' } : {}),
  ...(data.heroContent && data.footerBrand ? { branding: 'Branding' } : {}),
  social: 'Social',
  seo: 'SEO',
  endpoints: 'Endpoints',
  art: 'Concept art',
  git: 'Changes',
})

function setDirty(v) { dirty = v; status(dirty ? 'unsaved changes' : '') }
window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault() })

function status(msg, cls = '') {
  const s = $('#status')
  if (s) { s.textContent = msg; s.className = cls }
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'content-type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  })
  const json = await res.json()
  if (!res.ok) throw new Error(json.error || res.statusText)
  return json
}

async function save(name, value, label) {
  try {
    await api('PUT', `/__admin/api/block/${name}`, value)
    setDirty(false)
    status(`${label} saved ✓`, 'ok')
  } catch (err) {
    status(`save failed: ${err.message}`, 'err')
    throw err
  }
}

function preview(path) {
  $('#purl').textContent = path
  $('#popen').href = path
  if ($('#pframe').getAttribute('src') !== path) $('#pframe').src = path
}

// ---- fields ---------------------------------------------------------------

function textField(obj, key, label, opts = {}) {
  const input = el('input', {
    type: 'text', value: obj[key] ?? '',
    oninput: () => {
      if (input.value === '') delete obj[key]
      else obj[key] = input.value
      opts.after?.()
      setDirty(true)
    },
  })
  const wrap = el('div', {}, el('label', {}, label), input)
  if (opts.color) {
    const swatch = el('input', {
      type: 'color', value: /^#[0-9a-fA-F]{6}$/.test(obj[key] ?? '') ? obj[key] : '#000000',
      oninput: () => { obj[key] = swatch.value; input.value = swatch.value; setDirty(true) },
    })
    input.addEventListener('input', () => {
      if (/^#[0-9a-fA-F]{6}$/.test(input.value)) swatch.value = input.value
    })
    wrap.replaceChildren(el('label', {}, label), el('div', { class: 'row' }, swatch, input))
  }
  return wrap
}

// Asset paths (card bg, story/cover image, OG image) are free text, but we
// know every image under public/, so the field autocompletes real paths and
// flags one that points at a file that isn't there — the 404-only-on-deploy
// class of typo. Loaded once, lazily.
let assetList = null
async function ensureAssets() {
  if (!assetList) {
    assetList = (await api('GET', '/__admin/api/assets')).assets
    let dl = document.getElementById('asset-list')
    if (!dl) { dl = el('datalist', { id: 'asset-list' }); document.body.append(dl) }
    dl.replaceChildren(...assetList.map((a) => el('option', { value: a })))
  }
  return assetList
}

// Upload one File into public/assets/img and return its /assets/… path.
// Refreshes the cached asset list so the new file shows up everywhere.
async function uploadAsset(file) {
  const res = await fetch(`/__admin/api/assets/upload?${new URLSearchParams({ filename: file.name })}`,
    { method: 'POST', body: await file.arrayBuffer() })
  const json = await res.json()
  if (!res.ok) throw new Error(json.error)
  assetList = null
  await ensureAssets()
  return json.path
}

// Full-screen thumbnail browser over everything in public/assets/img, with a
// filter box and an inline upload. Resolves the chosen /assets/… path, or null
// if cancelled. No native dialogs — errors show inline (they no-op in embedded
// browsers otherwise).
function openAssetPicker() {
  return new Promise((resolve) => {
    const grid = el('div', { class: 'picker-grid' })
    const err = el('span', { style: 'color:var(--err);font-size:12px' })
    const render = (filter = '') => {
      const items = (assetList ?? []).filter((a) => a.toLowerCase().includes(filter.toLowerCase()))
      if (!items.length) { grid.replaceChildren(el('div', { class: 'placeholder' }, 'no matching images')); return }
      grid.replaceChildren(...items.map((a) => el('button', { class: 'picker-cell', onclick: () => close(a) },
        el('div', { class: 'ph', style: `background-image:url('${a}')` }),
        el('div', { class: 'cap' }, a.replace('/assets/img/', '')))))
    }
    const search = el('input', { type: 'text', placeholder: 'filter…', oninput: () => render(search.value) })
    const fileInput = el('input', { type: 'file', accept: 'image/*', style: 'display:none',
      onchange: async () => {
        if (!fileInput.files[0]) return
        err.textContent = ''
        try { close(await uploadAsset(fileInput.files[0])) }
        catch (e) { err.textContent = 'upload failed: ' + e.message }
      } })
    const overlay = el('div', { class: 'picker-overlay', onclick: (e) => { if (e.target === overlay) close(null) } },
      el('div', { class: 'picker-panel' },
        el('div', { class: 'picker-head' },
          el('h3', {}, 'Pick image'), search, err,
          el('button', { onclick: () => fileInput.click() }, 'Upload new'),
          el('button', { onclick: () => close(null) }, 'Cancel')),
        grid, fileInput))
    const close = (val) => { overlay.remove(); document.removeEventListener('keydown', onKey); resolve(val) }
    const onKey = (e) => { if (e.key === 'Escape') close(null) }
    document.addEventListener('keydown', onKey)
    document.body.append(overlay)
    render()
    search.focus()
  })
}

// An image field: live thumbnail + a path input (still typeable, with the
// asset-list autocomplete + exists/missing flag) + Choose (browse) / Upload /
// Clear. Drop-in for any string field holding an /assets/… image path.
function assetPicker(obj, key, label, opts = {}) {
  const thumb = el('div', { class: 'asset-thumb' })
  const flag = el('small', {})
  const refresh = () => {
    const v = (obj[key] ?? '').trim()
    const base = v.split('?')[0]
    thumb.style.setProperty('--thumb', v ? `url('${base}')` : 'none')
    thumb.classList.toggle('empty', !v)
    thumb.textContent = v ? '' : '🖼'
    if (!v) { flag.textContent = ''; return }
    const ok = assetList?.includes(base)
    flag.textContent = ok ? '✓ file exists' : '⚠ no file at this path in public/'
    flag.style.color = ok ? 'var(--ok)' : 'var(--err)'
  }
  const input = el('input', {
    type: 'text', list: 'asset-list', value: obj[key] ?? '',
    oninput: () => {
      if (input.value === '') delete obj[key]; else obj[key] = input.value
      refresh(); opts.after?.(); setDirty(true)
    },
  })
  const setVal = (v) => {
    if (v) obj[key] = v; else delete obj[key]
    input.value = v || ''
    refresh(); opts.after?.(); setDirty(true)
  }
  const fileInput = el('input', { type: 'file', accept: 'image/*', style: 'display:none',
    onchange: async () => {
      if (!fileInput.files[0]) return
      try { status('uploading…'); setVal(await uploadAsset(fileInput.files[0])); status('uploaded ✓', 'ok') }
      catch (e) { status('upload failed: ' + e.message, 'err') }
    } })
  refresh()
  return el('div', {},
    el('label', {}, label),
    el('div', { class: 'asset-row' },
      thumb,
      el('div', { class: 'asset-body' }, input, flag,
        el('div', { class: 'asset-btns' },
          el('button', { onclick: async () => { const p = await openAssetPicker(); if (p !== null) setVal(p) } }, 'Choose…'),
          el('button', { onclick: () => fileInput.click() }, 'Upload…'),
          el('button', { onclick: () => setVal('') }, 'Clear'))),
      fileInput))
}

function paragraphsField(obj, key, label) {
  const ta = el('textarea', {
    value: (obj[key] ?? []).join('\n\n'),
    oninput: () => {
      const paras = ta.value.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean)
      if (paras.length) obj[key] = paras
      else delete obj[key]
      setDirty(true)
    },
  })
  return el('div', {}, el('label', {}, `${label} — blank line separates paragraphs`), ta)
}

function listField(obj, key, label) {
  const input = el('input', {
    type: 'text', value: (obj[key] ?? []).join(', '),
    oninput: () => {
      const items = input.value.split(',').map((s) => s.trim()).filter(Boolean)
      obj[key] = items
      setDirty(true)
    },
  })
  return el('div', {}, el('label', {}, `${label} — comma separated`), input)
}

function checkField(obj, key, label) {
  const input = el('input', {
    type: 'checkbox', checked: !!obj[key],
    onchange: () => { obj[key] = input.checked; setDirty(true) },
  })
  return el('label', {}, input, label)
}

function saveBar(onSave, extra = []) {
  return el('div', { class: 'bar' },
    el('button', { onclick: onSave }, 'Save'),
    ...extra,
    el('span', { id: 'status' }))
}

// No native dialogs anywhere — prompt()/confirm() are suppressed in embedded
// browsers, which made the old add-game button appear dead.

// "+ add" that swaps itself for an inline slug input with create/cancel.
function addRow(onCreate, takenSlugs) {
  const btn = el('button', { class: 'add', onclick: () => {
    const input = el('input', { type: 'text', placeholder: 'new-slug-kebab-case',
      onkeydown: (e) => { if (e.key === 'Enter') create(); if (e.key === 'Escape') cancel() } })
    const create = () => {
      const slug = input.value.trim()
      if (!/^[a-z0-9-]+$/.test(slug)) return status('slug must be kebab-case: a-z, 0-9, dashes', 'err')
      if (takenSlugs().includes(slug)) return status(`"${slug}" already exists`, 'err')
      onCreate(slug)
    }
    const cancel = () => wrap.replaceWith(addRow(onCreate, takenSlugs))
    const wrap = el('div', {},
      input,
      el('div', { class: 'row', style: 'margin-top:6px' },
        el('button', { class: 'add', onclick: create }, 'create'),
        el('button', { class: 'add', onclick: cancel }, 'cancel')))
    btn.replaceWith(wrap)
    input.focus()
  } }, '+ add game')
  return btn
}

// Delete button that arms on first click and fires on the second. The
// two-click arm IS the confirmation, so callers save immediately — a
// staged-but-unsaved delete looks done and then silently isn't.
function armedDelete(label, onDelete) {
  let armed = false
  const btn = el('button', { class: 'ghost', onclick: () => {
    if (!armed) {
      armed = true
      btn.textContent = 'click again to delete & save'
      setTimeout(() => { armed = false; btn.textContent = label }, 3000)
      return
    }
    onDelete()
  } }, label)
  return btn
}

// ---- games tab ------------------------------------------------------------

function renderGames() {
  const games = data.games
  if (!games.some((g) => g.slug === selected)) selected = games[0]?.slug ?? null
  const game = games.find((g) => g.slug === selected)

  // The array order here is the homepage/nav order. Reorder with ↑↓, then
  // Save — the games.js write persists whatever order you've arranged.
  const moveGame = (i, delta) => {
    const j = i + delta
    if (j < 0 || j >= games.length) return
    ;[games[i], games[j]] = [games[j], games[i]]
    setDirty(true)
    renderGames()
  }
  $('#list').replaceChildren(
    ...games.map((g, i) => el('div', { class: `reorder-row${g.slug === selected ? ' active' : ''}` },
      el('div', { class: 'ctl' },
        el('button', { onclick: () => moveGame(i, -1), disabled: i === 0 ? '' : undefined }, '↑'),
        el('button', { onclick: () => moveGame(i, 1), disabled: i === games.length - 1 ? '' : undefined }, '↓')),
      el('button', {
        class: `item${g.slug === selected ? ' active' : ''}`,
        onclick: () => { selected = g.slug; renderGames() },
      }, g.title, el('small', {}, g.slug)))),
    addRow((slug) => {
      games.push({ slug, title: slug, tagline: '', description: '', categories: [],
        bgColor: '#888888', comingSoon: true, framedArt: false, gameplay: [], story: [] })
      selected = slug
      setDirty(true)
      renderGames()
    }, () => games.map((g) => g.slug)))

  if (!game) { $('#form').replaceChildren(el('div', { class: 'placeholder' }, 'no games')); return }

  const storyImage = game.storyImage ?? {}
  const syncStoryImage = () => {
    if (storyImage.src || storyImage.alt) game.storyImage = storyImage
    else delete game.storyImage
  }

  $('#form').replaceChildren(
    el('h2', {}, 'Card'),
    textField(game, 'title', 'Title'),
    textField(game, 'tagline', 'Tagline'),
    textField(game, 'description', 'Description (fallback)'),
    listField(game, 'categories', 'Categories'),
    el('div', { class: 'row' },

// so adding/removing/renaming a crowdfunding game no longer needs a manual
// seo-config edit. Only runs where that block exists (staging).
async function syncCrowdfundingSlugs(cfGames) {
  if (!data.crowdfundingSlugs) { status('saved ✓', 'ok'); return }
  const want = cfGames.map((g) => g.slug)
  if (JSON.stringify(want) === JSON.stringify(data.crowdfundingSlugs)) {
    status('saved ✓ — SEO slug list already in sync', 'ok')
    return
  }
  data.crowdfundingSlugs = want
  await save('crowdfundingSlugs', want, 'seo-config.js')
  status('saved ✓ — synced the SEO slug list in seo-config.js', 'ok')
}

function renderCrowdfunding() {

// ---- concept-art tab -------------------------------------------------------
// Files under src/assets/games/<slug>/concept/<category>/. The gallery sorts
// by filename, so ordering = the NN- prefixes; "save order" renumbers via the
// server's two-pass rename (variants ride along, no re-encode). Uploads get
// slugified + next-number-prefixed, and variants regenerate on the spot.

let artData = null
let artOrder = null // working copy of the selected category's file order

async function renderArt() {
  if (!artData) artData = await api('GET', '/__admin/api/art')
  const pairs = artData.games.flatMap((g) =>
    g.categories.map((c) => ({ id: `${g.slug}/${c.name}`, game: g.slug, category: c.name, sources: c.sources })))
  if (!pairs.some((p) => p.id === selected)) selected = pairs[0]?.id ?? null
  const pair = pairs.find((p) => p.id === selected)

  $('#list').replaceChildren(
    ...pairs.map((p) => el('button', {
      class: `item${p.id === selected ? ' active' : ''}`,
      onclick: () => { selected = p.id; artOrder = null; setDirty(false); renderArt() },
    }, p.category, el('small', {}, `${p.game} · ${p.sources.length} file(s)`))))

  if (!pair) {
    $('#form').replaceChildren(el('div', { class: 'placeholder' },
      'No concept art yet. Create src/assets/games/<slug>/concept/<category>/ by uploading below… once a game exists.'))
    return
  }

  const { game, category } = pair
  artOrder ??= pair.sources.map((s) => s.file)
  const bySrc = Object.fromEntries(pair.sources.map((s) => [s.file, s]))
  const kb = (b) => `${Math.max(1, Math.round(b / 1024))} KB`

  const reloadArt = async () => { artData = null; artOrder = null; await renderArt() }

  const move = (i, delta) => {
    const j = i + delta
    if (j < 0 || j >= artOrder.length) return
    ;[artOrder[i], artOrder[j]] = [artOrder[j], artOrder[i]]
    setDirty(true)
    renderArt()
  }

  const card = (file, i) => {
    const s = bySrc[file]
    const thumb = s.variants.find((v) => v.width === 500) ?? s.variants[0]
    const url = `/src/assets/games/${game}/concept/${category}/${thumb ? thumb.file : file}`
    return el('div', { class: 'art-card' },
      el('div', { class: 'ctl' },
        el('button', { onclick: () => move(i, -1), disabled: i === 0 ? '' : undefined }, '↑'),
        el('button', { onclick: () => move(i, 1), disabled: i === artOrder.length - 1 ? '' : undefined }, '↓')),
      el('img', { src: url, alt: file, loading: 'lazy' }),
      el('div', { class: 'meta' },
        // Click the name to rename its descriptive part (NN- prefix and
        // extension are fixed). Filenames drive the gallery's alt text.
        el('div', { class: 'name', title: 'click to rename', onclick(e) {
          const prefix = file.match(/^\d+-/)?.[0] ?? ''
          const ext = file.slice(file.lastIndexOf('.'))
          const apply = async () => {
            try {
              const r = await api('POST', '/__admin/api/art/rename',
                { game, category, file, name: input.value })
              await reloadArt()
              status(r.file === file ? 'name unchanged' : `renamed to ${r.file} ✓`, 'ok')
            } catch (err) {
              status(`rename failed: ${err.message}`, 'err')
            }
          }
          const input = el('input', {
            type: 'text', value: file.slice(prefix.length, file.length - ext.length),
            style: 'min-width:140px',
            onkeydown: (ev) => {
              if (ev.key === 'Escape') renderArt()
              else if (ev.key === 'Enter') apply()
            },
          })
          e.currentTarget.replaceWith(el('div', { class: 'row' },
            el('span', { style: 'flex:none;color:var(--dim)' }, prefix),
            input,
            el('span', { style: 'flex:none;color:var(--dim)' }, ext),
            el('button', { class: 'ghost', style: 'color:var(--ok)', onclick: apply }, 'save'),
            el('button', { class: 'ghost', style: 'color:var(--dim)', onclick: () => renderArt() }, 'cancel')))
          input.focus()
        } }, file),
        el('small', {}, `${kb(s.bytes)} · ${s.kind}`),
        el('div', { class: 'chips' },
          ...(s.kind === 'passthrough'
            ? [el('span', {}, 'served as-is')]
            : s.missingVariants
              ? [el('span', { class: 'warn' }, 'no variants — invisible until regenerated')]
              : s.variants.map((v) => el('span', { class: v.stale ? 'warn' : '' },
                  `${v.width}w${v.stale ? ' stale' : ''}`))))),
      armedDelete('delete', async () => {
        try {
          await api('POST', '/__admin/api/art/delete', { game, category, file })
          await reloadArt()
          status(`${file} and its variants deleted ✓`, 'ok')
        } catch (err) {
          status(`delete failed: ${err.message}`, 'err')
        }
      }))
  }

  const fileInput = el('input', { type: 'file', multiple: '', accept: '.jpg,.jpeg,.png,.svg,.gif',
    style: 'display:none',
    onchange: async () => {
      for (const f of fileInput.files) {
        try {
          status(`uploading ${f.name}…`)
          const res = await fetch(`/__admin/api/art/upload?${new URLSearchParams({ game, category, filename: f.name })}`,
            { method: 'POST', body: await f.arrayBuffer() })
          const json = await res.json()
          if (!res.ok) throw new Error(json.error)
          status(`added ${json.file} ✓ (variants generated)`, 'ok')
        } catch (err) {
          status(`upload failed: ${err.message}`, 'err')
          break
        }
      }
      await reloadArt()
    } })

  $('#form').replaceChildren(
    el('h2', {}, `${game} — ${category}`),
    el('div', { class: 'art-grid' }, ...artOrder.map(card)),
    fileInput,
    el('div', { class: 'bar' },
      el('button', { onclick: async () => {
        try {
          const r = await api('POST', '/__admin/api/art/reorder', { game, category, order: artOrder })
          setDirty(false)
          await reloadArt()
          status(r.renamed ? `order saved — ${r.renamed} file(s) renumbered ✓` : 'order unchanged', 'ok')
        } catch (err) {
          status(`reorder failed: ${err.message}`, 'err')
        }
      } }, 'Save order'),
      el('button', { class: 'ghost', style: 'color:var(--dim)', onclick: () => fileInput.click() }, 'upload images'),
      el('button', { class: 'ghost', style: 'color:var(--dim)', onclick: async () => {
        status('regenerating variants…')
        await api('POST', '/__admin/api/art/regen')
        await reloadArt()
        status('variants regenerated ✓', 'ok')
      } }, 'regenerate variants'),
      el('span', { id: 'status' })))

  preview(`/games/${game}`)
}

// ---- changes tab -----------------------------------------------------------
// A read-only window on `git status` / `git diff` for the repo, so after
// editing here you can see exactly which source files changed before taking
// them through the branch → staging → PR flow by hand. Never writes anything.

async function renderGit() {
  let git
  try {
    git = await api('GET', '/__admin/api/git')
  } catch (err) {
    $('#list').replaceChildren(el('div', { class: 'placeholder' }, 'not a git repo?'))
    $('#form').replaceChildren(el('div', { class: 'placeholder' }, err.message))
    return
  }
  if (!git.files.some((f) => f.path === selected)) selected = git.files[0]?.path ?? null

  $('#list').replaceChildren(
    el('div', { class: 'placeholder', style: 'padding:8px 10px;text-align:left' },
      el('div', {}, 'on branch ', el('strong', { style: 'color:var(--text)' }, git.branch)),
      el('button', { class: 'add', style: 'margin-top:8px', onclick: () => renderGit() }, '↻ refresh')),
    ...git.files.map((f) => el('button', {
      class: `item${f.path === selected ? ' active' : ''}`,
      onclick: () => { selected = f.path; renderGit() },
    }, el('span', { class: `gstatus g-${f.status || 'x'}` }, f.status || '??'), ' ' + f.path)))

  if (!selected) {
    $('#form').replaceChildren(el('div', { class: 'placeholder' }, 'Working tree clean — nothing to commit.'))
    return
  }

  $('#form').replaceChildren(el('div', { class: 'placeholder' }, 'loading diff…'))
  try {
    const { diff } = await api('GET', `/__admin/api/git/diff?file=${encodeURIComponent(selected)}`)
    const pre = el('pre', { class: 'diff' })
    for (const line of diff.split('\n')) {
      const cls = line.startsWith('+') && !line.startsWith('+++') ? 'add'
        : line.startsWith('-') && !line.startsWith('---') ? 'del'
        : line.startsWith('@@') ? 'hunk' : line.startsWith('diff ') || line.startsWith('index ') ? 'meta' : ''
      pre.append(el('span', { class: `dl ${cls}` }, line + '\n'))
    }
    $('#form').replaceChildren(el('h2', {}, selected), diff.trim() ? pre
      : el('div', { class: 'placeholder' }, 'no textual diff (binary or unchanged)'))
  } catch (err) {
    $('#form').replaceChildren(el('div', { class: 'placeholder' }, `diff failed: ${err.message}`))
  }
}

let pendingTab = null
function render() {
  $('#tabs').replaceChildren(...Object.entries(TABS()).map(([id, label]) => el('button', {
    class: id === tab ? 'active' : '',
    onclick: () => {
      if (dirty && pendingTab !== id) {
        pendingTab = id
        status('unsaved changes — click the tab again to discard them', 'err')
        return
      }
      pendingTab = null
      setDirty(false)
      load().then(() => { tab = id; selected = null; render() })
    },
  }, label)))
  ;({ games: renderGames, crowdfunding: renderCrowdfunding, pages: renderPages, banner: renderBanner,
    branding: renderBranding, social: renderSocial, seo: renderSeo, endpoints: renderEndpoints,
    art: renderArt, git: renderGit })[tab]()
}

async function load() {
  data = await api('GET', '/__admin/api/data')
  await ensureAssets()
}

load().then(render).catch((err) => {
  document.body.replaceChildren(el('div', { class: 'placeholder' }, `failed to load: ${err.message}`))
})
</script>
